name: Rennli
options:
  bundleIdPrefix: com.example
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    MARKETING_VERSION: "11.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rennli:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: RennliWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: C'est Fait!
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: C'est Fait! يحتاج الكاميرا لمسح كود الطلب الموجود على الوصل
        UIAppFonts:
          - cairo-400.ttf
          - cairo-700.ttf
          - cairo-900.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rennli
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  RennliWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rennli.widgets
        TARGETED_DEVICE_FAMILY: "1"
